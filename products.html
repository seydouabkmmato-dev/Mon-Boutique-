<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produits</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <div class="content-area">
      <div class="page-header">
        <h2>📦 Produits</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="search-bar"><span>🔍</span><input type="text" id="searchInput" placeholder="Rechercher..." oninput="renderTable()"></div>
          <select id="filterCat" onchange="renderTable()" style="padding:8px 10px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px">
            <option value="">Toutes catégories</option>
          </select>
          <button class="btn btn-primary" onclick="openModal('productModal')">➕ Nouveau</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="productTable">
          <thead><tr><th>Code</th><th>Produit</th><th>Catégorie</th><th>Prix Achat</th><th>Prix Vente</th><th>Stock</th><th>Seuil</th><th>État</th><th>Actions</th></tr></thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Produit -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="productModalTitle">Nouveau produit</h3>
      <button class="modal-close" onclick="closeModal('productModal')">✕</button>
    </div>
    <input type="hidden" id="editProductId">
    <div class="form-row">
      <div class="form-group"><label>Nom *</label><input type="text" id="pName" required></div>
      <div class="form-group"><label>Catégorie</label>
        <select id="pCategory"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Marque</label><input type="text" id="pBrand"></div>
      <div class="form-group"><label>Référence</label><input type="text" id="pRef"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Prix d'achat (FCFA) *</label><input type="number" id="pPurchasePrice" min="0"></div>
      <div class="form-group"><label>Prix de vente (FCFA) *</label><input type="number" id="pSalePrice" min="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Stock initial</label><input type="number" id="pStock" min="0" value="0"></div>
      <div class="form-group"><label>Seuil d'alerte</label><input type="number" id="pThreshold" min="0" value="3"></div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="pDescription" rows="2"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('productModal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveProduct()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal QR -->
<div class="modal-overlay" id="qrModal">
  <div class="modal" style="max-width:320px;text-align:center">
    <div class="modal-header">
      <h3>QR Code</h3>
      <button class="modal-close" onclick="closeModal('qrModal')">✕</button>
    </div>
    <div id="qrContent"></div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-outline" onclick="printQR()">🖨️ Imprimer</button>
      <button class="btn btn-primary" onclick="closeModal('qrModal')">Fermer</button>
    </div>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
DB.init(); Auth.requireAuth(); applyTheme();
document.getElementById('sidebarMount').outerHTML = renderSidebar('products');
document.getElementById('topbarMount').outerHTML = renderTopbar('Produits');

function loadCategoryOptions(selectId, selectedId) {
  const sel = document.getElementById(selectId);
  sel.innerHTML = DB.getCategories().filter(c=>c.active).map(c=>
    `<option value="${c.id}" ${c.id==selectedId?'selected':''}>${c.name}</option>`).join('');
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('filterCat').value;
  loadCategoryOptions('filterCat');
  // Restore filter value
  document.getElementById('filterCat').value = cat;

  let products = DB.getProducts();
  if (q) products = products.filter(p => (p.name+p.code+p.brand||'').toLowerCase().includes(q));
  if (cat) products = products.filter(p => String(p.categoryId) === String(cat));

  const cats = {};
  DB.getCategories().forEach(c => cats[c.id] = c.name);

  document.getElementById('productBody').innerHTML = products.length === 0
    ? '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:30px">Aucun produit</td></tr>'
    : products.map(p => {
        const stockBadge = p.stock === 0
          ? '<span class="badge badge-danger">Épuisé</span>'
          : p.stock <= (p.alertThreshold||3)
          ? '<span class="badge badge-warning">Faible</span>'
          : '<span class="badge badge-success">Dispo</span>';
        const margin = p.salePrice > 0 ? Math.round((p.salePrice-p.purchasePrice)/p.salePrice*100) : 0;
        return `<tr>
          <td><code>${p.code}</code></td>
          <td><strong>${p.name}</strong><br><small style="color:var(--text-muted)">${p.brand||''}</small></td>
          <td>${cats[p.categoryId]||'-'}</td>
          <td>${fmt(p.purchasePrice)}</td>
          <td>${fmt(p.salePrice)} <small style="color:var(--success)">(+${margin}%)</small></td>
          <td><strong>${p.stock||0}</strong></td>
          <td>${p.alertThreshold||3}</td>
          <td>${stockBadge}</td>
          <td>
            <button class="btn btn-outline btn-sm btn-icon" title="Modifier" onclick="editProduct(${p.id})">✏️</button>
            <button class="btn btn-outline btn-sm btn-icon" title="QR Code" onclick="showQR(${p.id})">📱</button>
            <button class="btn btn-danger btn-sm btn-icon" title="Supprimer" onclick="deleteProduct(${p.id})">🗑️</button>
          </td>
        </tr>`;
      }).join('');
}

function initCatFilter() {
  const sel = document.getElementById('filterCat');
  sel.innerHTML = '<option value="">Toutes catégories</option>' +
    DB.getCategories().filter(c=>c.active).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

function saveProduct() {
  const id = document.getElementById('editProductId').value;
  const data = {
    name: document.getElementById('pName').value.trim(),
    categoryId: Number(document.getElementById('pCategory').value),
    brand: document.getElementById('pBrand').value.trim(),
    reference: document.getElementById('pRef').value.trim(),
    purchasePrice: Number(document.getElementById('pPurchasePrice').value),
    salePrice: Number(document.getElementById('pSalePrice').value),
    stock: Number(document.getElementById('pStock').value),
    alertThreshold: Number(document.getElementById('pThreshold').value) || 3,
    description: document.getElementById('pDescription').value.trim(),
    active: true,
  };
  if (!data.name) { toast('Nom obligatoire', 'error'); return; }
  if (id) {
    DB.updateProduct(Number(id), data);
    DB.log('Modification produit', data.name);
    toast('Produit modifié');
  } else {
    DB.addProduct(data);
    DB.log('Ajout produit', data.name);
    toast('Produit ajouté');
  }
  closeModal('productModal');
  renderTable();
}

function editProduct(id) {
  const p = DB.getProductById(id);
  if (!p) return;
  document.getElementById('productModalTitle').textContent = 'Modifier le produit';
  document.getElementById('editProductId').value = p.id;
  document.getElementById('pName').value = p.name;
  loadCategoryOptions('pCategory', p.categoryId);
  document.getElementById('pBrand').value = p.brand||'';
  document.getElementById('pRef').value = p.reference||'';
  document.getElementById('pPurchasePrice').value = p.purchasePrice||0;
  document.getElementById('pSalePrice').value = p.salePrice||0;
  document.getElementById('pStock').value = p.stock||0;
  document.getElementById('pThreshold').value = p.alertThreshold||3;
  document.getElementById('pDescription').value = p.description||'';
  openModal('productModal');
}

function deleteProduct(id) {
  confirmDelete('Supprimer ce produit ?', () => {
    DB.deleteProduct(id);
    toast('Produit supprimé', 'warn');
    renderTable();
  });
}

function showQR(id) {
  const p = DB.getProductById(id);
  if (!p) return;
  document.getElementById('qrContent').innerHTML = `
    <div style="margin-bottom:12px">${generateQRPlaceholder(p.code)}</div>
    <div style="font-weight:700;font-size:15px">${p.name}</div>
    <div style="color:var(--primary);font-size:14px;margin-top:4px">${fmt(p.salePrice)}</div>
    <div style="color:var(--text-muted);font-size:12px">Stock: ${p.stock} | Code: ${p.code}</div>`;
  openModal('qrModal');
}

function printQR() {
  printSection(document.getElementById('qrContent').innerHTML, 'Étiquette');
}

// Init modal
document.getElementById('productModal').addEventListener('click', e => {
  if (e.target === document.getElementById('productModal')) closeModal('productModal');
});
document.querySelector('#productModal .modal').addEventListener('click', e => e.stopPropagation());
document.getElementById('qrModal').addEventListener('click', e => {
  if (e.target === document.getElementById('qrModal')) closeModal('qrModal');
});

// New product — reset form
document.querySelector('button[onclick="openModal(\'productModal\')"]').addEventListener('click', () => {
  document.getElementById('productModalTitle').textContent = 'Nouveau produit';
  document.getElementById('editProductId').value = '';
  document.getElementById('pName').value = '';
  loadCategoryOptions('pCategory');
  ['pBrand','pRef','pDescription'].forEach(i => document.getElementById(i).value = '');
  ['pPurchasePrice','pSalePrice'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('pStock').value = 0;
  document.getElementById('pThreshold').value = 3;
});

initCatFilter();
loadCategoryOptions('pCategory');
renderTable();
</script>
</body>
</html>
