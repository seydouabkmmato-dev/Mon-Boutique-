<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-wrapper">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <div class="content-area">
      <div class="page-header">
        <h2>👤 Utilisateurs</h2>
        <button class="btn btn-primary" onclick="newUser()">➕ Nouvel utilisateur</button>
      </div>
      <div class="table-wrapper">
        <table><thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>Statut</th><th>Permissions</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="userModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h3 id="userModalTitle">Nouvel utilisateur</h3>
      <button class="modal-close" onclick="closeModal('userModal')">✕</button>
    </div>
    <input type="hidden" id="editUserId">
    <div class="form-row">
      <div class="form-group"><label>Nom complet *</label><input type="text" id="uName"></div>
      <div class="form-group"><label>Identifiant *</label><input type="text" id="uUsername"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Mot de passe *</label><input type="password" id="uPassword" placeholder="Laisser vide pour ne pas changer"></div>
      <div class="form-group"><label>Rôle</label>
        <select id="uRole" onchange="updatePermsByRole()">
          <option value="vendeur">Vendeur</option>
          <option value="caissier">Caissier</option>
          <option value="magasinier">Magasinier</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
    </div>
    <div style="font-weight:700;font-size:13px;margin-bottom:10px">Permissions</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="permsGrid"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveUser()">Enregistrer</button>
    </div>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
DB.init(); Auth.requireAuth(); applyTheme();
document.getElementById('sidebarMount').outerHTML = renderSidebar('users');
document.getElementById('topbarMount').outerHTML = renderTopbar('Utilisateurs');

const PERMS = ['dashboard','products','sales','purchases','customers','suppliers','cash','reports','users','settings'];
const PERM_LABELS = {dashboard:'Tableau de bord',products:'Produits',sales:'Ventes',purchases:'Achats',customers:'Clients',suppliers:'Fournisseurs',cash:'Caisse',reports:'Rapports',users:'Utilisateurs',settings:'Paramètres'};
const ROLE_PERMS = {
  admin: Object.fromEntries(PERMS.map(p=>[p,true])),
  vendeur: {dashboard:true,products:false,sales:true,purchases:false,customers:true,suppliers:false,cash:false,reports:false,users:false,settings:false},
  caissier: {dashboard:true,products:false,sales:true,purchases:false,customers:true,suppliers:false,cash:true,reports:false,users:false,settings:false},
  magasinier: {dashboard:true,products:true,sales:false,purchases:true,customers:false,suppliers:true,cash:false,reports:false,users:false,settings:false},
};

function renderPermsGrid(perms) {
  document.getElementById('permsGrid').innerHTML = PERMS.map(p=>`
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="perm_${p}" ${perms&&perms[p]?'checked':''}>
      ${PERM_LABELS[p]}
    </label>`).join('');
}

function updatePermsByRole() {
  const role = document.getElementById('uRole').value;
  renderPermsGrid(ROLE_PERMS[role]);
}

function getPermsFromForm() {
  return Object.fromEntries(PERMS.map(p=>[p,document.getElementById('perm_'+p)?.checked||false]));
}

function renderTable() {
  const users = DB.getUsers();
  document.getElementById('usersBody').innerHTML = users.map(u=>`<tr>
    <td><strong>${u.name}</strong></td>
    <td><code>${u.username}</code></td>
    <td><span class="badge ${u.role==='admin'?'badge-info':'badge-muted'}">${u.role}</span></td>
    <td><span class="badge ${u.active!==false?'badge-success':'badge-danger'}">${u.active!==false?'Actif':'Inactif'}</span></td>
    <td style="font-size:11px">${Object.entries(u.permissions||{}).filter(([,v])=>v).map(([k])=>PERM_LABELS[k]||k).join(', ')}</td>
    <td>
      <button class="btn btn-outline btn-sm btn-icon" onclick="editUser(${u.id})">✏️</button>
      <button class="btn btn-outline btn-sm btn-icon" onclick="toggleUser(${u.id})">${u.active!==false?'🔒':'🔓'}</button>
      ${u.id!==1?`<button class="btn btn-danger btn-sm btn-icon" onclick="deleteUser(${u.id})">🗑️</button>`:''}
    </td>
  </tr>`).join('');
}

function newUser() {
  document.getElementById('userModalTitle').textContent='Nouvel utilisateur';
  document.getElementById('editUserId').value='';
  document.getElementById('uName').value='';
  document.getElementById('uUsername').value='';
  document.getElementById('uPassword').value='';
  document.getElementById('uRole').value='vendeur';
  renderPermsGrid(ROLE_PERMS['vendeur']);
  openModal('userModal');
}

function editUser(id) {
  const u=DB.getUsers().find(x=>x.id===id); if(!u) return;
  document.getElementById('userModalTitle').textContent='Modifier utilisateur';
  document.getElementById('editUserId').value=u.id;
  document.getElementById('uName').value=u.name;
  document.getElementById('uUsername').value=u.username;
  document.getElementById('uPassword').value='';
  document.getElementById('uRole').value=u.role;
  renderPermsGrid(u.permissions);
  openModal('userModal');
}

function saveUser() {
  const id=document.getElementById('editUserId').value;
  const name=document.getElementById('uName').value.trim();
  const username=document.getElementById('uUsername').value.trim();
  const password=document.getElementById('uPassword').value;
  const role=document.getElementById('uRole').value;
  if(!name||!username){toast('Nom et identifiant obligatoires','error');return;}
  const data={name,username,role,permissions:getPermsFromForm(),active:true};
  if(password) data.password=password;
  if(id){
    DB.updateUser(Number(id),data);
    // Update session if editing self
    const current=Auth.getCurrentUser();
    if(current&&current.userId===Number(id)){
      sessionStorage.setItem(Auth.SESSION_KEY,JSON.stringify({...current,...data}));
    }
    toast('Utilisateur modifié');
  } else {
    if(!password){toast('Mot de passe obligatoire','error');return;}
    DB.addUser({...data,password});
    toast('Utilisateur créé');
  }
  closeModal('userModal');renderTable();
}

function toggleUser(id) {
  const u=DB.getUsers().find(x=>x.id===id); if(!u) return;
  if(id===1){toast('Impossible de désactiver l\'admin principal','error');return;}
  DB.updateUser(id,{active:!u.active});
  toast(u.active?'Utilisateur désactivé':'Utilisateur activé');
  renderTable();
}

function deleteUser(id) {
  if(id===1){toast('Impossible de supprimer l\'admin principal','error');return;}
  confirmDelete('Supprimer cet utilisateur ?',()=>{DB.deleteUser(id);toast('Supprimé','warn');renderTable();});
}

document.getElementById('userModal').addEventListener('click',e=>{if(e.target===document.getElementById('userModal'))closeModal('userModal');});
renderTable();
</script>
</body>
</html>
